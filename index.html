const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function vHome(){const nxt=STEPS[S.step],bi=nxt.blk;
 return `<header class="hdr"><div class="l" style="align-items:center"><div style="width:44px;height:44px;border-radius:10px;background:#fff;color:var(--green);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:20px;font-stretch:75%">AT</div><div><div class="ttl" style="font-size:30px">Stock the Shelf</div><div class="sub" style="font-size:14px">Alder Table Foods · Case Facilitation #4</div></div></div><div class="r"><div style="background:#fff;color:var(--ink);border-radius:8px;padding:6px 12px;display:flex;gap:8px;align-items:center"><span style="font-family:var(--display);font-weight:800;font-stretch:75%;font-size:14px;color:var(--bad);letter-spacing:.06em">SEPT 30</span><span style="font-weight:600;font-size:15px">Maya’s deadline</span></div><button class="btn yel" data-act="home">Back to: ${esc(nxt.label)}</button></div></header>
 <div class="main" style="flex-direction:row;gap:24px"><section class="fridge" aria-label="Group shelves"><div class="led"></div>${G.map((g,i)=>{const n=Math.floor(S.scores[i]/50),slots=19,shown=Math.min(n,slots);return `<div class="shelf gc${i}"><div class="slots">${Array.from({length:shown},(_,k)=>`<span class="tray${k>=S.lastTrays[i]?' new':''}"></span>`).join('')}${Array.from({length:Math.max(0,slots-shown)},()=>'<span class="slot"></span>').join('')}${n>slots?`<span class="gname" style="font-size:18px;margin-left:4px">+${n-slots}</span>`:''}</div><div class="plank"></div><div class="label"><span class="n">${g.name}</span><span class="p">${S.scores[i]}</span><span class="m">pts · ${n} meal${n===1?'':'s'}</span><button data-act="pts" data-g="${i}" data-p="-50" aria-label="Minus 50 ${g.name}">−50</button><button data-act="pts" data-g="${i}" data-p="50" aria-label="Plus 50 ${g.name}">+50</button></div></div>`}).join('')}</section>
 <aside style="width:250px;display:flex;flex-direction:column;gap:12px;flex:none"><div class="white" style="padding:14px 16px"><span class="cap">Up next</span><div style="font-weight:800;font-size:20px;margin-top:4px">${esc(nxt.label)}</div></div><div class="white" style="padding:14px 16px;display:flex;flex-direction:column;gap:7px;flex:1"><span class="cap">Every 50 points = 1 meal</span><span style="font-size:15px"><b>+50</b> correct card or answer</span><span style="font-size:15px"><b>+50</b> done on time</span><span style="font-size:15px"><b>+50</b> backed by a case fact</span><span style="font-size:15px"><b>+100</b> first right financial answer</span></div></aside></div>
 <nav class="strip" style="padding:0 36px 18px" aria-label="Session">${BLOCKS.map((b,i)=>`<div class="${i<bi?'done':i===bi?'now':''}" style="flex:${b[1]}">${b[0]}</div>`).join('')}</nav>`}

function render(){const st=stepObj();let h;
 if(S.home){h=vHome()}else switch(st.id){
  case 'opening':h=vOpening();break;
  case 'quizBrief':case 'takeBrief':case 'ffBrief':case 'mapBrief':case 'vcBrief':case 'finBrief':case 'swotBrief':case 'afterBrief':h=brief(st.id);break;
  case 'quiz':h=vQuiz();break;
  case 'takeTimer':h=vPaper('First take','Worksheet · in groups',4,'take',['Fill in the “First take” column','Pick the plan you’d back now','When time’s up, call out your pick'],'Next: First picks');break;
  case 'firstPicks':h=vFirstPicks();break;
  case 'ffGame':h=vFF();break;
  case 'ffDebrief':h=vFFDebrief();break;
  case 'mapGame':h=vMapGame();break;
  case 'mapDebrief':h=vMapDebrief();break;
  case 'break':h=vBreak();break;
  case 'vcTimer':h=vPaper('Value chain','Poster · in groups',7,'vc',['Work through your 3 activities','One weakness each, with its case fact','Circle the most serious one'],'Show the answer key');break;
  case 'vcReveal':h=vVCReveal();break;
  case 'finTimer':h=vPaper('Financial indicators','Worksheet · in groups',7,'fin',['Use Exhibit 1 and the formulas','Work out each indicator for both years','Raise your hand when you have one'],'Show the answers');break;
  case 'finReveal':h=vFinReveal();break;
  case 'swotGame':h=vSwot();break;
  case 'mapAlt':h=vMapAlt();break;
  case 'afterTimer':h=vPaper('Final take','Worksheet · in groups',6,'after',['Fill in the “After analysis” column','Use the SWOT and numbers on the right as evidence','Fill in “What changed our minds?”'],'Final picks',true);break;
  case 'finalPicks':h=vFinalPicks();break;
  case 'share':h=vShare();break;
  case 'podium':h=vPodium();break;
 }
 $('#stage').innerHTML=h;
 if(S.home)S.lastTrays=S.scores.map(s=>Math.floor(s/50));
 $('#jump').value=String(S.step);$('#homebtn').classList.toggle('on',S.home);
 updateTimerUI();
 if(!S.home&&st.id==='mapAlt')requestAnimationFrame(drawAltArrows);
 duck();save();
}

function drawAltArrows(){const svg=document.getElementById('arrows'),grid=document.getElementById('grid9'),al=document.getElementById('alderChip');if(!svg||!grid||!al)return;
 const sc=scale||1,gr=grid.getBoundingClientRect(),c=e=>{const r=e.getBoundingClientRect();return{x:(r.left+r.width/2-gr.left)/sc,y:(r.top+r.height/2-gr.top)/sc,w:r.width/sc,h:r.height/sc}};
 const A=c(al);let out='<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C9580A"/></marker></defs>';
 ['altA','altB'].forEach(id=>{const e=document.getElementById(id);if(!e)return;const T=c(e),dx=T.x-A.x,dy=T.y-A.y,horiz=Math.abs(dx)>Math.abs(dy),len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len;
  const so=horiz?A.w/2+6:A.h/2+6,eo=horiz?T.w/2+8:T.h/2+8;
  out+=`<line x1="${A.x+ux*so}" y1="${A.y+uy*so}" x2="${T.x-ux*eo}" y2="${T.y-uy*eo}" stroke="#C9580A" stroke-width="3" marker-end="url(#ah)"/>`});
 svg.setAttribute('width',gr.width/sc);svg.setAttribute('height',gr.height/sc);svg.innerHTML=out}

/* ======================= timer ======================= */
function startTimer(sec,owner){S.timer={total:sec,left:sec,run:true,end:Date.now()+sec*1000,owner:owner};$('#stage').classList.remove('flash');updateTimerUI();save()}
function updateTimerUI(){const t=S.timer;document.querySelectorAll('.tleft').forEach(el=>{el.textContent=fmt(t.left);el.classList.toggle('done',t.total>0&&t.left<=0&&el.classList.contains('tm'));el.classList.toggle('low',t.left>0&&t.left<=30)});
 document.querySelectorAll('.trays').forEach(tr=>{const n=+tr.dataset.n,f=Math.ceil(t.left/60);[...tr.children].forEach((c,i)=>c.classList.toggle('f',i<Math.min(n,f)))});
 $('#tplay').textContent=t.run?'Pause':'Resume'}
function enterStep(){const st=stepObj();
 if(st.id==='quiz'){if(!S.quiz.debrief&&!S.quiz.rev&&S.timer.owner!=='quiz-'+S.quiz.i)startTimer(15,'quiz-'+S.quiz.i);return}
 if(st.id==='share'){const o='share-'+S.share.g+'-'+S.share.phase;if(S.timer.owner!==o)startTimer(S.share.phase==='share'?60:40,o);return}
 if(st.sec&&S.timer.owner!==st.id)startTimer(st.sec,st.id)}
setInterval(()=>{const t=S.timer;if(!t.run)return;t.left=Math.max(0,(t.end-Date.now())/1000);if(t.left<=0){t.run=false;bell();$('#stage').classList.add('flash');setTimeout(()=>$('#stage').classList.remove('flash'),3200);if(stepObj().id==='quiz'&&!S.quiz.rev&&!S.quiz.debrief&&!S.home){S.quiz.rev=true;render()}save()}updateTimerUI()},250);

/* ======================= audio ======================= */
let ac=null,master,beatGain,noiseBuf,beatTimer=null,nextT=0,stepN=0;
function ensureAC(){try{if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(!A)return false;ac=new A();master=ac.createGain();master.gain.value=S.vol;master.connect(ac.destination);beatGain=ac.createGain();beatGain.gain.value=0;beatGain.connect(master);const len=ac.sampleRate;noiseBuf=ac.createBuffer(1,len,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1}if(ac.state==='suspended')ac.resume();return true}catch(e){return false}}
function tone(freq,t,dur,vol,type,dest){const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+dur+0.05)}
function noise(t,dur,vol,filt,freq,dest){const s=ac.createBufferSource();s.buffer=noiseBuf;const f=ac.createBiquadFilter();f.type=filt;f.frequency.value=freq;const g=ac.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(dest||master);s.start(t);s.stop(t+dur+0.05)}
function bell(){if(!ensureAC())return;const t=ac.currentTime+0.02;[0,0.38,0.76].forEach(d=>{tone(1046,t+d,1.2,0.35);tone(1568,t+d,0.9,0.18);tone(2093,t+d,0.5,0.08)})}
function drumroll(done){if(!ensureAC()){done&&done();return}const t0=ac.currentTime+0.05;let t=t0,gap=0.07,v=0.15;while(t<t0+2.4){noise(t,0.05,v,'bandpass',1800);t+=gap;gap=Math.max(0.028,gap*0.97);v=Math.min(0.5,v*1.02)}
 const end=t0+2.45;tone(70,end,0.6,0.7,'sine');noise(end,1.6,0.5,'highpass',5000);noise(end,0.4,0.4,'bandpass',1500);setTimeout(()=>done&&done(),2500)}
const CHORDS=[[220,261.6,329.6,392],[174.6,220,261.6,329.6],[261.6,329.6,392,493.9],[196,246.9,293.7,392]];
function scheduleBeat(){const spb=60/84/4;while(nextT<ac.currentTime+0.15){const s=stepN%16,bar=Math.floor(stepN/16)%4,t=nextT;
  if(s===0||s===10){tone(110,t,0.28,0.55,'sine',beatGain);tone(55,t,0.3,0.4,'sine',beatGain)}
  if(s===4||s===12)noise(t,0.18,0.22,'bandpass',1400,beatGain);
  if(s%2===0)noise(t,0.04,s%4===2?0.09:0.05,'highpass',7000,beatGain);
  if(s===0)CHORDS[bar].forEach(f=>tone(f,t,spb*15,0.045,'triangle',beatGain));
  if(s===8)tone(CHORDS[bar][3]*2,t,0.4,0.03,'sine',beatGain);
  nextT+=spb;stepN++}}
function setBeat(on){if(on&&!ensureAC()){toast('Sound isn’t available in this browser',true);return}S.beat=on;
 if(on){nextT=ac.currentTime+0.05;stepN=0;clearInterval(beatTimer);beatTimer=setInterval(scheduleBeat,50);duck()}else{clearInterval(beatTimer);beatTimer=null;if(beatGain)beatGain.gain.setTargetAtTime(0,ac.currentTime,0.1)}
 $('#beatbtn').textContent=on?'Beat: on':'Beat: off';$('#beatbtn').classList.toggle('on',on);if(stepObj().id==='break'&&!S.home)render()}
function duck(){if(!ac||!S.beat)return;const talk=!S.home&&stepObj().talk;beatGain.gain.setTargetAtTime(talk?0.35:1,ac.currentTime,0.4)}

function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cv=$('#confetti'),cx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;const cols=['#1E5FA3','#C9580A','#93306A','#FFD43B','#1F5A43'];
 const P=Array.from({length:170},()=>({x:innerWidth/2+(Math.random()-.5)*240,y:innerHeight*.35,vx:(Math.random()-.5)*15,vy:-Math.random()*15-4,s:6+Math.random()*7,c:cols[Math.floor(Math.random()*5)],r:Math.random()*6}));let f=0;
 (function tick(){cx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.1;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});if(++f<160)requestAnimationFrame(tick);else cx.clearRect(0,0,cv.width,cv.height)})()}

function placeCard(key,id,zone){const st=S[key],cards=key==='ff'?FF:SW,c=cards.find(x=>x.id===id);if(!c)return;const t=st.turn;st.sel=null;
 const ok=c.z===zone;if(ok){st.placed[id]=zone;S.scores[t]+=50}st.turn=(t+1)%3;render();
 toast(ok?`Correct! ${G[t].name} stocks a meal · +50`:`Not quite. ${G[t].name}’s turn passes.`,!ok)}
function go(i){i=Math.max(0,Math.min(STEPS.length-1,i));S.home=false;S.step=i;enterStep();render()}

/* ======================= events ======================= */
document.addEventListener('click',e=>{
 const zone=e.target.closest('[data-drop]');
 if(zone&&!e.target.closest('button')){const k=zone.dataset.k;if(S[k]&&S[k].sel){placeCard(k,S[k].sel,zone.dataset.drop);return}}
 const cell=e.target.closest('.cell[data-cell]');
 if(cell&&S.map.sel&&!S.home&&stepObj().id==='mapGame'&&!e.target.closest('[data-act="msel"]')){S.map.cells[S.map.sel]=+cell.dataset.cell;S.map.sel=null;S.map.turn=(S.map.turn+1)%3;render();return}
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,g=+b.dataset.g;
 if(a!=='beat')ensureAC();
 switch(a){
  case 'next':go(S.step+1);break;
  case 'prev':if(S.home){S.home=false;render()}else go(S.step-1);break;
  case 'home':S.home=!S.home;render();break;
  case 'pts':S.scores[g]=Math.max(0,S.scores[g]+(+b.dataset.p));render();toast(((+b.dataset.p)>0?'+':'')+b.dataset.p+' '+G[g].name,(+b.dataset.p)<0);break;
  case 'ontime':{const arr=S.awards[b.dataset.id]||(S.awards[b.dataset.id]=[false,false,false]);arr[g]=!arr[g];S.scores[g]=Math.max(0,S.scores[g]+(arr[g]?50:-50));render();if(arr[g])toast(`On time · +50 ${G[g].name}`);break}
  case 'tplay':{const t=S.timer;if(t.run){t.run=false;t.left=Math.max(0,(t.end-Date.now())/1000)}else{if(t.left<=0)t.left=t.total||60;t.run=true;t.end=Date.now()+t.left*1000}updateTimerUI();save();break}
  case 'tadd':{const t=S.timer;t.left+=60;t.total=Math.max(t.total,t.left);if(t.run)t.end+=60000;updateTimerUI();save();break}
  case 'treset':{const t=S.timer;startTimer(t.total||60,t.owner);break}
  case 'beat':ensureAC();setBeat(!S.beat);break;
  case 'testbell':bell();break;
  case 'resetask':$('#confirmslot').innerHTML=`<div id="confirm">Start a new game? This clears every score, pick and answer on this laptop.<button class="btn solid" data-act="resetyes">Clear and start over</button><button class="btn" data-act="resetno">Keep playing</button></div>`;break;
  case 'resetyes':{const vol=S.vol;setBeat(false);S=fresh();S.vol=vol;$('#confirmslot').innerHTML='';go(0);break}
  case 'resetno':$('#confirmslot').innerHTML='';break;
  case 'qok':{const Q=S.quiz;if(Q.rev)break;Q.win[Q.i]=g;Q.rev=true;S.timer.run=false;S.scores[g]+=50;render();toast(`${G[g].name} called it · +50`);break}
  case 'qno':{const Q=S.quiz,l=Q.lock[Q.i]||(Q.lock[Q.i]=[false,false,false]);l[g]=true;if(l.every(Boolean)){Q.rev=true;S.timer.run=false}render();toast(`${G[g].name}: wrong · locked out`,true);break}
  case 'qrev':S.quiz.rev=true;S.timer.run=false;render();break;
  case 'qnext':{S.quiz.i++;const l=S.quiz.lock[S.quiz.i];S.quiz.rev=S.quiz.win[S.quiz.i]!=null||(!!l&&l.every(Boolean));enterStep();render();break}
  case 'qprev':S.quiz.i--;S.quiz.rev=true;render();break;
  case 'qdebrief':S.quiz.debrief=true;startTimer(60,'quizdebrief');render();break;
  case 'qback':S.quiz.debrief=false;S.quiz.rev=true;render();break;
  case 'pick':S.picks[b.dataset.w][g]=b.dataset.k;render();break;
  case 'sel':{const k=b.dataset.k;S[k].sel=S[k].sel===b.dataset.id?null:b.dataset.id;render();break}
  case 'turn':S[b.dataset.k].turn=g;render();break;
  case 'rate':S.ff.rate[b.dataset.f]=S.ff.rate[b.dataset.f]===b.dataset.r?null:b.dataset.r;render();break;
  case 'msel':S.map.sel=S.map.sel===b.dataset.id?null:b.dataset.id;render();break;
  case 'mkey':S.map.key=!S.map.key;render();break;
  case 'alt':{const i=+b.dataset.i;S.alt[i]=!S.alt[i];render();break}
  case 'leak':S.vc.leak=S.vc.leak===b.dataset.id?null:b.dataset.id;render();break;
  case 'finrev':S.fin.rev[b.dataset.m]=!S.fin.rev[b.dataset.m];render();break;
  case 'finwin':S.fin.win[b.dataset.m]=g;S.fin.rev[b.dataset.m]=true;S.scores[g]+=100;render();toast(`First correct · +100 ${G[g].name}`);break;
  case 'finundo':{const w=S.fin.win[b.dataset.m];if(w!=null)S.scores[w]=Math.max(0,S.scores[w]-100);delete S.fin.win[b.dataset.m];render();break}
  case 'shareq':S.share.phase='q';enterStep();render();break;
  case 'sharenext':S.share.done[S.share.g]=true;S.share.g=Math.min(2,S.share.g+1);S.share.phase='share';enterStep();render();break;
  case 'shareg':S.share.g=g;S.share.phase='share';enterStep();render();break;
  case 'drumroll':b.disabled=true;drumroll(()=>{S.podium.rev=true;render();confetti()});break;
  case 'confetti':confetti();break;
 }
});
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-act="sel"]');if(c){e.dataTransfer.setData('text/plain',c.dataset.k+'|'+c.dataset.id);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('[data-drop]'))e.preventDefault()});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;e.preventDefault();const parts=(e.dataTransfer.getData('text/plain')||'').split('|');if(parts[0]&&parts[1]&&S[parts[0]])placeCard(parts[0],parts[1],z.dataset.drop)});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='vol'){S.vol=+t.value;if(master)master.gain.setTargetAtTime(S.vol,ac.currentTime,0.05);save();return}const f=t.dataset&&t.dataset.field;if(f){S.rec[f]=t.value;save()}});
document.addEventListener('change',e=>{if(e.target.id==='jump')go(+e.target.value)});
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(S.step+1)}else if(e.key==='ArrowLeft'){e.preventDefault();go(S.step-1)}});

let scale=1;
function fit(){const vw=innerWidth,vh=innerHeight-54;scale=Math.min(vw/1280,vh/720);const st=$('#stage');st.style.transform=`scale(${scale})`;st.style.margin=`${(720*scale-720)/2}px ${(1280*scale-1280)/2}px`;if(!S.home&&stepObj().id==='mapAlt')requestAnimationFrame(drawAltArrows)}
addEventListener('resize',fit);

$('#jump').innerHTML=STEPS.map((s,i)=>`<option value="${i}">${i+1}. ${s.label}</option>`).join('');
$('#vol').value=S.vol;
fit();enterStep();render();
})();
</script>
